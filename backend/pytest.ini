[pytest]
testpaths = tests
addopts = -ra
markers =
    db: prueba de integración que necesita TEST_DATABASE_URL (PostgreSQL local de prueba)
filterwarnings =
    # Avisos de librerías y de código que usa APIs viejas (utcnow, Query.get): no son fallos.
    ignore::DeprecationWarning
    ignore:.*Query.get\(\) method is considered legacy.*
