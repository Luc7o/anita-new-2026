[project]
name = "anita-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.0.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Migrate==4.0.7",
    "Flask-JWT-Extended==4.6.0",
    "Flask-Cors==4.0.1",
    "PyMySQL==1.1.1",
    "python-dotenv==1.0.1",
    "email-validator==2.2.0",
    "Flask-Limiter==3.8.0",
    "Pillow>=11.0",
    "cryptography==43.0.0",
    "resend==2.7.0",
    "requests==2.32.3",
    "vercel_blob",
    "xhtml2pdf==0.2.16",
]

[tool.vercel]
entrypoint = "run:app"